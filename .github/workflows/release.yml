name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            dir="dist/jikunode_${version}_linux_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION" \
              -o "$dir/jikunode" ./cmd/jikunode
            tar -C "$dir" -czf "dist/jikunode_${version}_linux_${arch}.tar.gz" \
              jikunode
            rm -rf "$dir"
          done
          # Windows: the CLI plus the windowless tray app that runs it at logon.
          for arch in amd64 arm64; do
            dir="dist/jikunode_${version}_windows_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build               -trimpath               -ldflags "-s -w -X main.Version=$VERSION"               -o "$dir/jikunode.exe" ./cmd/jikunode
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build               -trimpath               -ldflags "-s -w -H=windowsgui"               -o "$dir/jikunode-tray.exe" ./cmd/jikunode-tray
            (cd "$dir" && zip -X -q "../jikunode_${version}_windows_${arch}.zip" jikunode.exe jikunode-tray.exe)
            rm -rf "$dir"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Sign release checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$(mktemp)"
          message_file="$(mktemp)"
          trap 'rm -f "$key_file" "$message_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          printf 'jikunode-release-v1:' > "$message_file"
          cat dist/checksums.txt >> "$message_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in "$message_file" -out dist/checksums.txt.sig

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
            deploy/jikunode/install-user.sh
            deploy/windows/install-user.ps1

  container:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jiku-app/jikunode
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/jikunode/Dockerfile
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
