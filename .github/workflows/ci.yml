name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/jikunode
      - name: Build Windows tray app
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags "-H=windowsgui" ./cmd/jikunode-tray
      - name: Cross-check Windows from Linux
        if: runner.os == 'Linux'
        env:
          GOOS: windows
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath ./cmd/jikunode ./cmd/jikunode-tray
